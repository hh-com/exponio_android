apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// ---------------------------------------------------------------------------------------------
// Optionale Release-Signierung: android/keystore.properties (nicht einchecken!)
//   storeFile=exponio-release.jks
//   storePassword=...
//   keyAlias=exponio
//   keyPassword=...
// Ohne diese Datei wird nur die Debug-APK gebaut (signiert mit ~/.android/debug.keystore).
// ---------------------------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "org.exponio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.exponio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            // JSch und Bouncy Castle bringen identische Multi-Release-Metadaten mit,
            // die Android nicht nutzt und die sonst zu "2 files found" führen.
            excludes += ['/META-INF/versions/**', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def cameraxVersion = '1.6.2'

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')

    // Kamera (In-App-Serienaufnahme)
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // EXIF lesen (Ausrichtung) und schreiben (Metadaten übernehmen)
    implementation "androidx.exifinterface:exifinterface:1.4.2"

    // SFTP: gepflegter JSch-Fork; Bouncy Castle für Ed25519/Curve25519/ML-KEM auf Android
    implementation "com.github.mwiede:jsch:2.28.8"
    implementation "org.bouncycastle:bcprov-jdk18on:1.87"

    // FTPS (explizites TLS) für Webhosting ohne SFTP. Bouncy Castle JSSE, weil viele Server
    // (ProFTPD-Standard) verlangen, dass die Datenverbindung die TLS-Sitzung wiederverwendet.
    implementation "commons-net:commons-net:3.13.0"
    implementation "org.bouncycastle:bctls-jdk18on:1.87"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
